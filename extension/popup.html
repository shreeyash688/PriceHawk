<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PriceHawk</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <!-- Header -->
  <header class="top">
    <div class="brand">
      <span class="logo-wrap" aria-hidden="true">
        <svg class="logo" viewBox="0 0 32 32"><path d="M2 8l9 3 5-6 5 6 9-3-5 9-4 1-5 9-5-9-4-1z"/></svg>
      </span>
      <div>
        <h1>PriceHawk</h1>
        <p class="conn" id="conn" data-state="loading"><span class="dot"></span><span id="connText">Connecting…</span></p>
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="exportBtn" type="button" title="Export tracked products (CSV)" aria-label="Export tracked products to CSV">
        <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
      </button>
      <button class="icon-btn" id="exportHistoryBtn" type="button" title="Export price history (CSV)" aria-label="Export price history to CSV">
        <svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg>
      </button>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="tabs" role="tablist" aria-label="PriceHawk views">
    <button class="tab" data-view="track" data-state="active" role="tab" aria-selected="true" type="button">Track</button>
    <button class="tab" data-view="list" data-state="inactive" role="tab" aria-selected="false" type="button">
      Tracked <span id="count" class="count">0</span>
    </button>
  </nav>

  <main>
    <!-- ================= Track view ================= -->
    <section id="view-track" class="view">

      <article class="product" id="productCard" data-state="loading">
        <div class="product-top">
          <span class="store" id="pStore">Detecting…</span>
          <span class="pill" id="detectStatus" data-tone="muted" role="status" aria-live="polite">
            <span class="dot"></span><span id="detectText">Looking…</span>
          </span>
        </div>

        <h2 class="product-title" id="pTitle">Looking for a product on this page…</h2>
        <p class="product-hint hidden" id="pHint"></p>
        <button class="link-btn hidden" id="retryBtn" type="button">Try again</button>

        <div class="product-body" id="pBody">
          <span class="label">Current price<span class="converted hidden" id="pOriginal"></span></span>
          <span class="price" id="pPrice">—</span>

          <div class="gauge">
            <div class="progress"><i id="gaugeFill"></i></div>
            <span class="gauge-text" id="gaugeText">Set a target price below</span>
          </div>
        </div>

        <a class="product-url hidden" id="pUrl" target="_blank" rel="noopener noreferrer"></a>
      </article>

      <div class="form">
        <div class="field">
          <label class="field-label" for="target">Target price</label>
          <div class="input-group">
            <span class="input-addon" id="targetCurrencyAddon">₹</span>
            <input id="target" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal">
          </div>
          <div class="chips" id="chips" aria-label="Quick targets">
            <button class="chip" type="button" data-off="5">5% off</button>
            <button class="chip" type="button" data-off="10">10% off</button>
            <button class="chip" type="button" data-off="20">20% off</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="email">Alert email</label>
          <div class="input-group">
            <span class="input-addon">
              <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>
            </span>
            <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
          </div>
        </div>

        <button class="link-btn" id="manualToggle" type="button" aria-expanded="false" aria-controls="manualField">
          Paste a product link instead
        </button>

        <div class="field hidden" id="manualField">
          <label class="field-label" for="manualUrl">Product link</label>
          <div class="input-group">
            <input id="manualUrl" type="url" placeholder="https://www.amazon.in/dp/…">
            <button class="btn" data-variant="ghost" data-size="sm" id="previewBtn" type="button">Preview</button>
          </div>
        </div>
      </div>

      <button class="btn" data-size="lg" id="trackBtn" type="button">
        <span class="spinner hidden" id="trackSpin"></span>
        <span id="trackBtnText">Start tracking</span>
      </button>
    </section>

    <!-- ================= Tracked view ================= -->
    <section id="view-list" class="view hidden">
      <div class="list-head">
        <div class="segmented" role="radiogroup" aria-label="Sort tracked products">
          <button type="button" data-sort="newest" data-state="active" role="radio" aria-checked="true">Newest</button>
          <button type="button" data-sort="deals" data-state="inactive" role="radio" aria-checked="false">Closest to target</button>
        </div>
        <button class="icon-btn" id="refreshListBtn" type="button" title="Refresh" aria-label="Refresh tracked products">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6"/></svg>
        </button>
      </div>

      <ul id="items" class="items"></ul>

      <div id="empty" class="empty hidden">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2 8l9 3 5-6 5 6 9-3-5 9-4 1-5 9-5-9-4-1z"/></svg>
        <div class="empty-title">Nothing tracked yet</div>
        <p class="empty-desc">Track a product and it will show up here.</p>
      </div>
    </section>
  </main>

  <!-- Pop-up dialog (list full, server out of date) -->
  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card" data-tone="amber">
      <div class="modal-icon" aria-hidden="true">!</div>
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <pre class="modal-code hidden" id="modalCode"></pre>
      <div class="modal-actions">
        <button class="btn" data-variant="ghost" id="modalSecondary" type="button">Close</button>
        <button class="btn" id="modalPrimary" type="button"></button>
      </div>
    </div>
  </div>

  <!-- One toast for both tabs -->
  <div class="toast hidden" id="alert" role="status" aria-live="polite">
    <span class="toast-icon" aria-hidden="true"></span>
    <span id="alertText"></span>
    <button class="toast-close" id="alertClose" type="button" aria-label="Dismiss">×</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
